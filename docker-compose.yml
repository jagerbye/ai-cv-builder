# The whole system: `docker compose up` and nothing else (architecture.md §5).
# Secrets: ANTHROPIC_API_KEY comes from the host environment or .env (see
# .env.example) through substitution. It is never written into this file.
# DATABASE_URL below is the in-network address of the db service, so it is set
# here and not read from .env (which holds the host-side value for local runs).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_cv_builder
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_cv_builder"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_cv_builder
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_MAX_OUTPUT_TOKENS: ${ANTHROPIC_MAX_OUTPUT_TOKENS:-}
      ANTHROPIC_TOKEN_BUDGET_PER_JOB: ${ANTHROPIC_TOKEN_BUDGET_PER_JOB:-}
    # Migrations first; the server starts listening only if they succeed.
    command: ["sh", "-c", "npx prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # vite preview forwards /api/* to the api over the compose network (QA-01).
      API_PROXY_TARGET: http://api:3000
    ports:
      # 5173 is the vite default and is routinely taken by another project
      # on this machine; the container keeps 5173, the host gets WEB_PORT.
      - "127.0.0.1:${WEB_PORT:-5273}:5173"
    depends_on:
      - api

volumes:
  dbdata:
