# ci.yml — the gate lives outside sessions too. CI runs the SAME script as
# the Stop hook and the agents (scripts/gate.sh), so a session cannot ship
# anything CI would reject, and CI cannot demand anything sessions don't run.
name: gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    # Live-DB tests (api health) run against a real Postgres, never a mock.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_cv_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      # The gate forces its own DATABASE_URL (ai_cv_builder_test, ADR-019), then creates
      # and migrates it, so CI and local runs do exactly the same thing.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_cv_builder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx prisma generate --schema api/prisma/schema.prisma
      - run: bash framework/scripts/gate.sh
